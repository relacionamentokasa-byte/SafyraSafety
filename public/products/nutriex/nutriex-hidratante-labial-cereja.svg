<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="stickGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#be123c"/>
      <stop offset="35%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <filter id="stickShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-opacity="0.16" flood-color="#0f172a"/>
    </filter>
  </defs>

  <rect width="400" height="500" rx="16" fill="url(#bgGrad5)"/>
  <ellipse cx="200" cy="455" rx="60" ry="10" fill="#000000" opacity="0.12" filter="blur(4px)"/>

  <g filter="url(#stickShadow)">
    <rect x="170" y="370" width="60" height="60" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <rect x="170" y="110" width="60" height="260" rx="10" fill="url(#stickGrad)" stroke="#ffffff" stroke-width="1.5"/>

    <text x="200" y="160" font-family="Arial, sans-serif" font-weight="900" font-size="11" fill="#ffffff" text-anchor="middle" letter-spacing="1">NUTRIEX</text>
    <text x="200" y="172" font-family="Arial, sans-serif" font-weight="700" font-size="6.5" fill="#ffffff" opacity="0.9" text-anchor="middle">PROFISSIONAL</text>

    <text x="200" y="210" font-family="Arial, sans-serif" font-weight="800" font-size="9" fill="#ffffff" text-anchor="middle">HIDRATANTE</text>
    <text x="200" y="223" font-family="Arial, sans-serif" font-weight="800" font-size="9" fill="#ffffff" text-anchor="middle">LABIAL</text>

    <circle cx="200" cy="270" r="26" fill="#ffffff" stroke="#be123c" stroke-width="2"/>
    <text x="200" y="264" font-family="Arial, sans-serif" font-weight="900" font-size="8" fill="#be123c" text-anchor="middle">FPS</text>
    <text x="200" y="282" font-family="Arial, sans-serif" font-weight="900" font-size="18" fill="#be123c" text-anchor="middle">30</text>

    <text x="200" y="325" font-family="Arial, sans-serif" font-weight="900" font-size="7.5" fill="#ffffff" text-anchor="middle">SABOR CEREJA</text>
    <text x="200" y="345" font-family="Arial, sans-serif" font-weight="700" font-size="7" fill="#ffffff" opacity="0.9" text-anchor="middle">PESO LÍQ. 5g</text>
  </g>
