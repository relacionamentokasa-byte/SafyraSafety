    <text x="200" y="170" font-family="Arial, sans-serif" font-weight="900" font-size="14" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">NUTRIEX</text>
    <text x="200" y="183" font-family="Arial, sans-serif" font-weight="700" font-size="8" fill="#ffffff" opacity="0.9" text-anchor="middle" letter-spacing="1">PROFISSIONAL</text>

