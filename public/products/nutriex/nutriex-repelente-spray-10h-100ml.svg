      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="sprayShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-opacity="0.16" flood-color="#0f172a"/>
