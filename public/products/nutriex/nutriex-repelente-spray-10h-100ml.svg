    <text x="200" y="284" font-family="Arial, sans-serif" font-weight="900" font-size="10" fill="#ffffff" text-anchor="middle">ATÉ</text>
    <text x="200" y="306" font-family="Arial, sans-serif" font-weight="900" font-size="20" fill="#ffffff" text-anchor="middle">10 HORAS</text>
    <text x="200" y="318" font-family="Arial, sans-serif" font-weight="700" font-size="7.5" fill="#ffffff" opacity="0.9" text-anchor="middle">DE PROTEÇÃO</text>

    <text x="200" y="355" font-family="Arial, sans-serif" font-weight="800" font-size="8" fill="#1e293b" text-anchor="middle">CONTRA AEDES AEGYPTI</text>
    <text x="200" y="370" font-family="Arial, sans-serif" font-weight="700" font-size="7.5" fill="#64748b" text-anchor="middle">TOQUE SECO • DERMATOLÓGICO</text>

