    <rect x="170" y="50" width="60" height="65" rx="12" fill="#a7f3d0" opacity="0.45" stroke="#6ee7b7" stroke-width="1.5"/>
    <rect x="182" y="80" width="36" height="35" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
