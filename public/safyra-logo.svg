<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" fill="none">
  <!-- Safyra Safety Official Logo Vector -->
  <defs>
    <linearGradient id="safyra-primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="safyra-accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="safyra-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1e40af" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Shield / Gem Icon Mark -->
  <g transform="translate(15, 10)" filter="url(#safyra-shadow)">
    <!-- Outer Shield Diamond Polygon -->
    <path d="M40 5 L75 25 L75 55 C75 72 40 85 40 85 C40 85 5 72 5 55 L5 25 Z"
          fill="url(#safyra-primary-grad)" />

    <!-- Inner Facet Highlights (Safyra Gem Structure) -->
    <path d="M40 5 L40 85 C40 85 75 72 75 55 L75 25 Z"
          fill="white" fill-opacity="0.12" />

    <!-- Central Safety Check / Diamond Angle -->
    <path d="M40 18 L60 32 L40 70 L20 32 Z"
          fill="url(#safyra-accent-grad)" fill-opacity="0.9" />

    <path d="M40 28 L52 38 L38 58 L28 48 L33 43 L38 48 L47 34 Z"
          fill="#ffffff" />
  </g>

  <!-- Typography -->
  <!-- "SAFYRA" -->
  <text x="110" y="56"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="40"
        font-weight="800"
        letter-spacing="-0.5"
        fill="#0f172a">
    SAFYRA
  </text>

  <!-- "SAFETY" Badge / Text -->
  <text x="278" y="56"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="40"
        font-weight="900"
        letter-spacing="-0.5"
        fill="#2563eb">
    SAFETY
  </text>

  <!-- Subtitle Tagline -->
  <text x="112" y="78"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="11"
        font-weight="700"
        letter-spacing="4.5"
        fill="#64748b">
    SEGURANÇA &amp; PERFORMANCE
  </text>
</svg>
